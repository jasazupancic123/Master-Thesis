runConfig:
  minInstances: 1
  cpu: 2
  memoryMiB: 1024
  ingress: internal-and-cloud-load-balancing

env:
  - variable: FIREBASE_ADMIN_EMAIL
    secret: FIREBASE_ADMIN_EMAIL
  - variable: FIREBASE_ADMIN_PASSWORD
    secret: FIREBASE_ADMIN_PASSWORD

scripts:
  buildCommand: npm run build
  runCommand: cross-env NODE_ENV=production node dist/main
