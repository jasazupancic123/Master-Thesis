name: Release Merge, Build & Deploy

on:
  push:
    tags:
      - 'v*'             # triggers on tag pushes like v1.0.0
  release:
    types: [published]   # triggers when you publish a release in UI
  workflow_dispatch:      # allows manual testing

permissions:
  contents: write         # needed for branch merge and push

jobs:
  merge-to-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into release
        run: |
          git checkout release
          git pull origin release
          git merge origin/main --no-edit
          git push origin release

  build-and-deploy-backend:
    needs: [merge-to-release]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitcode-backend-nest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fitcode-backend-nest/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: blindoff-web-app

      - name: Deploy to App Engine (with retry)
        env:
          NODE_ENV: production
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          FRONTEND_WHITELIST: ${{ secrets.FRONTEND_WHITELIST }}
        run: |
          for i in {1..3}; do
            gcloud app deploy --project=blindoff-web-app app.yaml --quiet && break || \
            echo "Retrying deploy ($i/3)..." && sleep 10
          done