name: Release Merge, Build & Deploy

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-to-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into release
        run: |
          git checkout release
          git pull origin release
          git merge origin/main --no-edit
          git push origin release

  build-and-deploy-backend:
    needs: [merge-to-release]
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: fitcode-backend-nest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fitcode-backend-nest/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      # authenticate and deploy
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: blindoff-web-app

      - name: Generate secure app.yaml with secrets
        working-directory: fitcode-backend-nest
        run: |
          echo "" >> app.yaml
          echo "env_variables:" >> app.yaml
          echo "  NODE_ENV: 'production'" >> app.yaml
          echo "  JWT_SECRET: '${{ vars.JWT_SECRET }}'" >> app.yaml
          echo "  ADMIN_EMAIL: '${{ vars.ADMIN_EMAIL }}'" >> app.yaml
          echo "  ADMIN_PASSWORD: '${{ vars.ADMIN_PASSWORD }}'" >> app.yaml
          echo "  FRONTEND_URL: '${{ vars.FRONTEND_URL }}'" >> app.yaml
          echo "  FRONTEND_WHITELIST: '${{ vars.FRONTEND_WHITELIST }}'" >> app.yaml

      - name: Deploy to App Engine (with retry)
        run: |
          for i in {1..3}; do
            gcloud app deploy --quiet && break || \
            echo "Retrying deploy ($i/3)..." && sleep 10
          done