name: Staging Deploy (Backend Only)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    environment: Preview
    defaults:
      run:
        working-directory: fitcode-backend-nest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fitcode-backend-nest/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      # authenticate and deploy
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: blindoff-staging

      - name: Generate secure app-staging.yaml with secrets
        working-directory: fitcode-backend-nest
        run: |
          echo "" >> app-staging.yaml
          echo "env_variables:" >> app-staging.yaml
          echo "  NODE_ENV: 'staging'" >> app-staging.yaml
          echo "  ADMIN_EMAIL: '${{ vars.ADMIN_EMAIL }}'" >> app-staging.yaml
          echo "  ADMIN_PASSWORD: '${{ vars.ADMIN_PASSWORD }}'" >> app-staging.yaml
          echo "  FRONTEND_WHITELIST: '${{ vars.FRONTEND_WHITELIST }}'" >> app-staging.yaml

      - name: Deploy to App Engine (with retry)
        run: |
          for i in {1..3}; do
            gcloud app deploy app-staging.yaml --quiet && break || \
            echo "Retrying deploy ($i/3)..." && sleep 10
          done
